# Managed runtime versions for this project — https://mise.jdx.dev
# Replaces the previous Volta pin. Provision with: `mise install`
#
# Node 24+ is required (see package.json "engines"). Bun 1.3.x is the
# preferred runtime going forward; it is provisioned here so it is available,
# while the npm-based build/test scripts continue to run on Node for now.
[tools]
node = "24"
bun = "1.3"
