services:
  family-chronicles-server:
    container_name: family-chronicles-server
    image: family-chronicles/family-chronicles-server
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DB_DRIVER: mongo
      DB_HOST: mongodb://mongo:27017
      DB_USER: ${MONGO_USER:-admin}
      DB_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - UPLOADS:/data/uploads
    networks:
      - family-chronicles-network
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    container_name: mongo
    image: mongo:7
    restart: unless-stopped
    volumes:
      - MONGO_DATA:/data/db
      - MONGO_CONFIG:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: family-chronicles
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - family-chronicles-network

  # Optional database UI: `docker compose --profile tools up`
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongo:27017/
    networks:
      - family-chronicles-network

networks:
  family-chronicles-network:
    driver: bridge
    name: family-chronicles-network

volumes:
  MONGO_DATA:
  MONGO_CONFIG:
  UPLOADS:
