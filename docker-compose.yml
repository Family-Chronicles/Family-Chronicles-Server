services:
  family-chronicles-server:
    container_name: family-chronicles-server
    image: family-chronicles/family-chronicles-server
    restart: always
    build: .
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-family-chronicles}
      MONGO_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-}
      PASSWORD_PRIVATE_KEY_BASE64: ${PASSWORD_PRIVATE_KEY_BASE64:-}
      PASSWORD_PUBLIC_KEY_BASE64: ${PASSWORD_PUBLIC_KEY_BASE64:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    links:
      - mongo
    networks:
      - family-chronicles-network
    depends_on:
      - mongo
      - mongo-express

  mongo:
    container_name: mongo
    image: mongo:latest
    volumes:
      - type: volume
        source: MONGO_DATA
        target: /data/db
      - type: volume
        source: MONGO_CONFIG
        target: /data/configdb
      - type: volume
        source: MONGO_LOG
        target: /var/log/mongodb
    ports:
      - "27017:27017"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-family-chronicles}
    networks:
      - family-chronicles-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-admin}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
    networks:
      - family-chronicles-network

networks:
  family-chronicles-network:
    driver: bridge
    name: family-chronicles-network

volumes:
  MONGO_DATA:
  MONGO_CONFIG:
  MONGO_LOG:
